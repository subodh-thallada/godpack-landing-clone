<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- Edge to edge under the notch (the app pads itself with safe-area
         insets); the keyboard resizes the layout on Android like it does on
         iOS. Zoom stays allowed: inputs are 16px so the page never needs it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <!-- The app is dark-only, so both schemes get its background. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#101014" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#101014" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>%WEB_TITLE%</title>
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        margin: 0;
        background: #101014;
        /* An app, not a document: no pull-to-refresh or page rubber band, and
           nothing can widen the page (a glow or ring that pokes past the edge
           would otherwise make phones zoom the whole layout out). */
        overflow: hidden;
        overscroll-behavior: none;
      }
      html {
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      #root {
        display: flex;
        flex: 1;
        height: 100%;
        height: 100dvh;
      }
      /* Controls react immediately (no double-tap wait) and don't select
         their labels on long-press. Content text stays selectable. */
      button,
      a,
      [role='button'],
      [role='tab'],
      [role='checkbox'],
      [role='radio'],
      [role='switch'],
      [role='menuitem'] {
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      /* iOS zooms into any field under 16px and never zooms back. */
      @media (pointer: coarse) {
        input,
        textarea,
        select {
          font-size: max(16px, 1em) !important;
        }
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
